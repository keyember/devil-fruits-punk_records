name: Backend validation

on:
  push:
    branches:
      - feat/full-punk-record
  pull_request:
    branches:
      - feat/full-punk-record

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/punk_record?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: punk_record
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d punk_record"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx --yes --package typescript --package @types/node tsc -p tsconfig.json --noEmit
